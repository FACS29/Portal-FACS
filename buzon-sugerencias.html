<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buzón de Sugerencias — FACS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="buzon-sugerencias.css">
</head>
<body>

<button id="btnModoOscuro" class="btn-modo-oscuro" title="Cambiar a modo oscuro">🌙</button>

<header>
    <img src="logo.png" alt="Logo FACS" class="logo">
    <h1>Buzón de Sugerencias</h1>
</header>

<main class="contenedor-buzon">
    <div class="card">

        <div id="vistaFormulario">
            <p class="texto-buzon">
                Hola <strong id="nombreMostrado">afiliado(a)</strong>, escríbenos lo que quieras
                contarnos: una sugerencia, una inquietud o un reclamo. Tu mensaje llega
                directamente a la administración del Fondo.
            </p>

            <form id="formMensaje">
                <input type="hidden" id="documentoOculto">
                <input type="hidden" id="nombreOculto">

                <label for="mensaje">Tu mensaje</label>
                <textarea id="mensaje" rows="6" required
                    placeholder="Escribe aquí..."></textarea>

                <button type="submit" id="btnEnviar">Enviar mensaje</button>
            </form>

            <p id="mensajeError" class="mensaje-error"></p>
        </div>

        <div id="vistaExito" style="display:none">
            <p class="texto-exito">✔ Tu mensaje fue enviado. Gracias por escribirnos.</p>
        </div>

        <a href="index.html" class="volver">← Volver al portal</a>
    </div>
</main>

<script src="modo-oscuro.js"></script>
<script src="supabase.js"></script>
<script src="buzon-sugerencias.js"></script>
</body>
</html>
