<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definir contraseña — Panel FACS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="admin-login.css">
</head>
<body>

  <div class="login-card">
    <img src="logo.png" alt="Logo FACS" class="logo">
    <h1>Definir contraseña</h1>
    <p class="subtitulo" id="subtitulo">Verificando tu enlace...</p>

    <form id="formClave" autocomplete="off" style="display:none">
      <label for="clave1">Nueva contraseña</label>
      <input type="password" id="clave1" required minlength="6" autocomplete="new-password">

      <label for="clave2">Repite la contraseña</label>
      <input type="password" id="clave2" required minlength="6" autocomplete="new-password">

      <button type="submit" id="btnGuardar">Guardar y entrar al panel</button>
    </form>

    <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="set-password.js"></script>
</body>
</html>
