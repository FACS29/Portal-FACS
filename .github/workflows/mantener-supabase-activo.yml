name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 13 * * *"   # todos los días, 8:00 a. m. hora de Colombia
  workflow_dispatch:         # permite lanzarlo a mano para probarlo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/Configuracion?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
