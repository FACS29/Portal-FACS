<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movimientos — FACS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-panel.css">
<link rel="stylesheet" href="admin-movimientos.css">
<link rel="stylesheet" href="admin-creditos.css">
</head>
<body>

<header class="topbar">
    <img src="logo.png" alt="Logo FACS" class="logo-mini">
    <h1>Panel Administrativo — FACS</h1>
    <div class="usuario-actual">
        <span id="nombreUsuario"></span>
        <button id="btnSalir">Salir</button>
    </div>
</header>

<nav class="menu-lateral">
    <a href="admin-panel.html" id="navAdministradores" style="display:none">Administradores</a>
    <a href="admin-dashboard.html">Dashboard financiero</a>
    <a href="admin-movimientos.html" class="activo">Movimientos</a>
    <a href="admin-creditos.html">Créditos</a>
    <a href="admin-mensajes.html">Mensajes <span id="contadorNoLeidos" class="badge"></span></a>
    <a href="admin-comunicados.html">Comunicados</a>
    <a href="admin-consultas.html">Consultas del portal</a>
</nav>

<main class="contenido">
    <div class="encabezado-seccion">
        <h2>Movimientos del Fondo</h2>
    </div>

    <div class="barra-filtros">
        <div class="campo-filtro">
            <label>Tipo de movimiento</label>
            <select id="filtroTipo">
                <option value="todos">Todos</option>
                <option value="Aporte">Aportes (Capital Semilla)</option>
                <option value="Desembolso">Desembolsos (créditos nuevos)</option>
                <option value="Pago">Pagos recibidos</option>
                <option value="Devolución">Devolución a deudor (anulados)</option>
                <option value="Retorno">Retorno de crédito anulado</option>
            </select>
        </div>
        <div class="campo-filtro">
            <label>Empresa</label>
            <select id="filtroEmpresa">
                <option value="todas">Todas</option>
                <option value="ELG">ELG</option>
                <option value="HLG">HLG</option>
                <option value="HSL">HSL</option>
            </select>
        </div>
        <div class="campo-filtro">
            <label>Desde</label>
            <input type="date" id="filtroDesde">
        </div>
        <div class="campo-filtro">
            <label>Hasta</label>
            <input type="date" id="filtroHasta">
        </div>
        <div class="campo-filtro">
            <label>Orden</label>
            <select id="filtroOrden">
                <option value="desc">Más reciente primero</option>
                <option value="asc">Más antiguo primero</option>
            </select>
        </div>
        <div class="campo-filtro">
            <label>Agrupar por</label>
            <select id="filtroAgrupar">
                <option value="ninguno">Cada movimiento (con SubTotal y Total)</option>
                <option value="fecha">Una fila por fecha (resumen)</option>
                <option value="fecha-empresa">Fecha + empresa (resumen)</option>
                <option value="fecha-concepto">Fecha + concepto (resumen)</option>
            </select>
        </div>
        <button id="btnLimpiarFiltros" class="btn-secundario">Limpiar filtros</button>
    </div>

    <p class="resumen-filtros" id="resumenFiltros"></p>

    <table class="tabla-movimientos">
        <thead>
            <tr>
                <th>Fecha</th><th>Tipo</th><th>Empresa</th><th>Referencia</th><th>Valor</th>
                <th>SubTotal (empresa)</th><th>Total</th>
            </tr>
        </thead>
        <tbody id="tablaMovimientosBody">
            <tr><td colspan="7">Cargando...</td></tr>
        </tbody>
    </table>
</main>

<div id="modalGrupo" class="modal-fondo" style="display:none">
    <div class="modal-caja modal-detalle">
        <div class="detalle-encabezado">
            <div>
                <h3 id="grupoTitulo">Movimientos de este grupo</h3>
                <p class="detalle-subtitulo" id="grupoSubtitulo">—</p>
            </div>
            <button type="button" id="btnCerrarGrupo" class="btn-secundario">Cerrar</button>
        </div>
        <table class="tabla-pagos">
            <thead>
                <tr><th>Fecha</th><th>Tipo</th><th>Empresa</th><th>Referencia</th><th>Valor</th></tr>
            </thead>
            <tbody id="tablaGrupoBody"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="admin-guard.js"></script>
<script src="admin-movimientos.js"></script>
</body>
</html>
